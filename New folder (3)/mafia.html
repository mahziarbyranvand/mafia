<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MAFIA | Roman Arena</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#050403;--panel:#141110;--line:#3a2f2b;
  --text:#f0e6d2;--mute:#a89680;
  --blood:#8b1e1e;--gold:#e8c46a;--gold-glow:0 0 15px rgba(232,196,106,0.6);
  --glass:rgba(20,17,16,.88);--green:#2a9d4a;
  --shadow:0 20px 60px rgba(0,0,0,0.8);
  box-sizing:border-box;
}
*{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;user-select:none}
body{color:var(--text);font-family:Vazirmatn,Tahoma,sans-serif;display:flex;justify-content:center;position:relative}
.gt{font-family:'Cinzel Decorative',Vazirmatn,Georgia,serif}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:10px 16px;background:var(--blood);color:#fff;font-weight:700;transition:all .2s}
button:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 20px #0008}
button:disabled{opacity:.4;cursor:not-allowed}
.gb{background:linear-gradient(180deg,var(--gold),#a8791f);color:#1a1008;border:1px solid var(--gold);box-shadow:0 4px 14px rgba(210,168,90,0.3)}
.ghost{background:rgba(0,0,0,0.6);border:1px solid var(--line);color:var(--gold);backdrop-filter:blur(8px)}
.gt{background:linear-gradient(135deg,var(--gold) 0%,#f7e3a1 50%,#a8791f 100%);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:900}
input,textarea{font:inherit;background:rgba(0,0,0,0.5);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px 14px;min-width:0}

#app{width:100%;max-width:800px;height:100%;display:flex;flex-direction:column;position:relative;overflow:hidden}

/* ====== Splash & Lobby ====== */
#splash{position:fixed;inset:0;z-index:999;background:#050403 url('bg_lobby.jpg') center/cover;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;transition:opacity .8s}
#splash::before{content:'';position:absolute;inset:0;background:rgba(5,4,3,.65);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#splash.out{opacity:0;pointer-events:none}
#splash video{position:relative;width:min(100vw,100vh);height:min(100vw,100vh);object-fit:cover;-webkit-mask-image:radial-gradient(circle,#000 62%,transparent 71%);mask-image:radial-gradient(circle,#000 62%,transparent 71%)}
#splash .sp-ui{position:absolute;left:0;right:0;bottom:6%;display:flex;flex-direction:column;align-items:center;z-index:2}
#splash h1{margin:0 0 10px;font-size:2.5rem;text-shadow:0 2px 14px #000}
#splash #spSound{position:absolute;top:16px;right:16px;z-index:3;padding:8px 12px;font-size:1.1rem}
.load-bar{width:200px;height:6px;background:rgba(255,255,255,.18);border-radius:99px;overflow:hidden;margin-top:6px}
.load-bar i{display:block;height:100%;width:0;background:var(--gold);animation:fill 6.6s linear forwards}
@keyframes fill{to{width:100%}}

.home{display:flex;flex-direction:column;height:100%;padding:20px;gap:16px;background:url('bg_lobby.jpg') center/cover;position:relative}
.home::before{content:'';position:absolute;inset:0;background:rgba(0,0,0,0.5);z-index:0}
.home>*{position:relative;z-index:1}
.pbar{display:flex;justify-content:space-between;align-items:center;padding:12px;background:var(--glass);border:1px solid var(--gold);border-radius:12px;backdrop-filter:blur(10px)}
.me{display:flex;gap:12px;align-items:center;cursor:pointer}
.arch{width:50px;height:50px;border-radius:50%;border:2px solid var(--gold);overflow:hidden;position:relative}
.arch img{width:100%;height:100%;object-fit:cover}
.frame-overlay{position:absolute;inset:-5px;background-size:contain;background-position:center;pointer-events:none;z-index:2}
.menu{display:flex;flex-direction:column;gap:12px;margin-top:auto;margin-bottom:20px;max-width:300px;margin-left:auto;margin-right:auto;width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* ====== Room Stage ====== */
body.in-room #app{max-width:none;background:#000}
.stage{--u:calc(min(100vw,150vh)/100);position:relative;margin:auto;width:calc(var(--u)*100);height:calc(var(--u)*66.667);overflow:hidden;font-size:calc(var(--u)*1.05);
  background:url('room_normal.png') center/100% 100%,url('room_normal.jpg') center/100% 100%,#000}
.stage.vip{background:url('room_vip.png') center/100% 100%,url('room_vip.jpg') center/100% 100%,url('room_normal.png') center/100% 100%,url('room_normal.jpg') center/100% 100%,#000;box-shadow:inset 0 0 0 calc(var(--u)*.3) var(--gold)}
.panel{position:absolute;background:rgba(10,8,7,.84);border:1px solid rgba(232,196,106,.45);border-radius:calc(var(--u)*.8);backdrop-filter:blur(3px)}
.plhead{left:1.5%;top:2.5%;width:16.5%;padding:calc(var(--u)*.8) calc(var(--u)*1.2);display:flex;justify-content:space-between;color:var(--gold);font-weight:700}
.plist{left:1.5%;top:9%;width:14%;padding:calc(var(--u)*.5)}
.pl{display:flex;align-items:center;gap:calc(var(--u)*.8);padding:calc(var(--u)*.45) calc(var(--u)*.7);border-bottom:1px solid #2a2320;cursor:pointer;position:relative}
.pl img,.pl b{width:calc(var(--u)*2.3);height:calc(var(--u)*2.3);border-radius:50%;object-fit:cover;background:#1b1715;border:1px solid #555;flex:none}
.pl.tk{background:linear-gradient(90deg,rgba(232,196,106,.25),transparent);border-radius:99px}
.pl.sel{outline:1px solid var(--gold);border-radius:99px}
.pl.dead{opacity:.35;text-decoration:line-through}
.pl i{margin-right:auto;font-style:normal}
.phase{right:1.5%;top:11%;width:10%;padding:calc(var(--u)*1) calc(var(--u)*.8);text-align:center}
.phase .big{font-size:calc(var(--u)*1.5);color:var(--gold);font-weight:900}
.phase .tm{font-size:calc(var(--u)*1.1);color:var(--mute);margin-bottom:calc(var(--u)*.8)}
.ph{display:flex;gap:calc(var(--u)*.8);align-items:center;padding:calc(var(--u)*.7);color:var(--mute);border-radius:calc(var(--u)*.5)}
.ph.on{color:var(--gold);background:rgba(232,196,106,.15)}
.topbtns{position:absolute;right:1.5%;top:2.5%;display:flex;gap:calc(var(--u)*.6)}
.topbtns button{width:calc(var(--u)*3.6);height:calc(var(--u)*3.6);padding:0;border-radius:calc(var(--u)*.8);font-size:calc(var(--u)*1.5)}
.seat{position:absolute;width:calc(var(--u)*8);transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;cursor:pointer;z-index:2}
.seat:hover,.seat.sel{z-index:10}
.avatar-wrap{position:relative;width:calc(var(--u)*4.8);height:calc(var(--u)*4.8);border-radius:50%;border:2px solid #6b5a3a;background:#17130f;box-shadow:0 4px 12px #000}
.avatar-wrap img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.avatar-wrap.talking{border-color:#4be36f;box-shadow:0 0 18px #4be36f}
.seat.sel .avatar-wrap{border-color:var(--gold);box-shadow:var(--gold-glow)}
.avatar-wrap.dead{filter:grayscale(1);opacity:.45}
.mic-icon{position:absolute;bottom:-3px;right:-3px;width:calc(var(--u)*1.7);height:calc(var(--u)*1.7);border-radius:50%;background:#8b1e1e;display:grid;place-items:center;font-size:calc(var(--u)*.9)}
.mic-icon.on{background:#2a9d4a}
.seat-name{font-size:calc(var(--u)*.95);margin-top:2px;color:#eee;background:rgba(0,0,0,.72);padding:1px calc(var(--u)*.7);border-radius:4px;white-space:nowrap}
.interaction-bar{display:none;gap:2px;margin-top:2px;background:rgba(0,0,0,.85);padding:1px 4px;border-radius:99px;border:1px solid #333}
.seat:hover .interaction-bar,.seat.sel .interaction-bar{display:flex}
.interaction-bar button{background:none;padding:1px 3px;font-size:calc(var(--u)*.95);color:#bbb;box-shadow:none;transform:none}
.chat{left:1.5%;bottom:3%;width:23%;height:22%;display:flex;flex-direction:column;padding:calc(var(--u)*.6);gap:calc(var(--u)*.5)}
.chat-box{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:3px}
.chat form{display:flex;gap:4px}
.chat input{flex:1;padding:calc(var(--u)*.5) calc(var(--u)*1);border-radius:99px;font-size:calc(var(--u)*1)}
.chat button{padding:0 calc(var(--u)*1.2);border-radius:99px}
.msg{font-size:calc(var(--u)*1);color:#ccc}
.msg b{color:var(--gold)}
.msg.sys{color:#4be36f;font-style:italic}
.roles{position:absolute;left:50%;bottom:1.2%;transform:translateX(-50%);display:flex;gap:calc(var(--u)*1.2)}
.rb{width:calc(var(--u)*5.6);padding:calc(var(--u)*.7) 0;text-align:center;background:rgba(10,8,7,.85);border:1px solid #3a2f2b;border-radius:4px 4px 14px 14px;opacity:.45;font-size:calc(var(--u)*.95)}
.rb span{display:block;font-size:calc(var(--u)*2)}
.rb.on{opacity:1;border-color:var(--gold);background:linear-gradient(#5a1414,#1a0a0a);box-shadow:var(--gold-glow)}
.acts{position:absolute;right:1.5%;bottom:3%;display:flex;flex-direction:column;gap:calc(var(--u)*.6);width:11%}
.acts button{padding:calc(var(--u)*.7);font-size:calc(var(--u)*1)}
.stage.night::before{content:'';position:absolute;inset:0;background:rgba(0,0,25,.58);z-index:1;pointer-events:none}
.panel,.topbtns,.roles,.acts{z-index:3}
#fx{position:absolute;inset:0;pointer-events:none;z-index:30}
.fl{position:absolute;font-size:calc(var(--u)*3.2);animation:fl 2s ease-out forwards}
@keyframes fl{from{opacity:1;transform:translate(-50%,-50%) scale(.6)}to{opacity:0;transform:translate(-50%,-250%) scale(1.3)}}
.avatar-wrap.voice{box-shadow:0 0 22px #4be36f,0 0 6px #fff}
.end{position:absolute;inset:0;z-index:50;background:rgba(0,0,0,.82);display:grid;place-items:center;text-align:center}
.end h2{font-size:calc(var(--u)*4);margin:0 0 calc(var(--u)*1)}

/* هم‌تراز با پنل‌های نقاشی‌شده روی عکس */
.plhead{left:1.4%;top:2.9%;width:15.2%;height:4.4%;padding:0 calc(var(--u)*1.2);align-items:center;background:#0d0a09}
.plist{left:1.4%;top:8.1%;width:12.8%;height:50.6%;padding:0;display:flex;flex-direction:column;direction:ltr;background:#0d0a09}
.pl{flex:1;padding:0 calc(var(--u)*.8)}
.pl i{margin-left:auto;margin-right:0}
.phase{left:87%;right:auto;top:10.9%;width:11.3%;height:35.7%;padding:calc(var(--u)*.8);background:#0d0a09;display:flex;flex-direction:column;justify-content:center}
.topbtns{right:auto;left:84%;top:2.9%;width:14.3%;height:4%}
.topbtns button{flex:1;width:auto;height:100%;background:#0d0a09}
.chat{left:1.4%;top:77.6%;bottom:auto;width:21.5%;height:16.6%;background:#0d0a09}
.roles{left:37.1%;bottom:auto;top:84.8%;transform:none;width:21%;height:9.8%;gap:calc(var(--u)*.6)}
.rb:not(.on){opacity:1;filter:brightness(.5)}
.rb{flex:1;width:auto;padding:0;display:flex;flex-direction:column;justify-content:center;background:#0d0a09}
/* Settings Styles */
.settings-card{background:var(--glass); border:1px solid rgba(232,196,106,0.3); border-radius:12px; padding:16px; box-shadow:0 4px 15px rgba(0,0,0,0.5); backdrop-filter:blur(10px); width:100%; margin-bottom:16px;}
.settings-title{color:var(--gold); margin:0 0 12px 0; font-size:1rem; display:flex; align-items:center; gap:8px;}
.switch{position:relative; display:inline-block; width:50px; height:26px;}
.switch input{opacity:0; width:0; height:0;}
.slider{position:absolute; cursor:pointer; top:0; left:0; right:0; bottom:0; background-color:#333; transition:.4s; border-radius:26px; border:1px solid #555;}
.slider:before{position:absolute; content:""; height:20px; width:20px; left:3px; bottom:2px; background-color:white; transition:.4s; border-radius:50%; box-shadow:0 2px 5px rgba(0,0,0,0.4);}
input:checked + .slider{background-color:#2a9d4a; border-color:#4be36f;}
input:checked + .slider:before{transform:translateX(24px);}

/* ====== قوانین / پنل مدیریت / توست / مودال (از نسخه‌ی دیپ‌سیک) ====== */
/* Rules */
.rules-container{display:flex;flex-direction:column;gap:8px;max-width:600px;margin:0 auto;width:100%;padding-bottom:30px}
details{background:rgba(20,17,16,0.85);border:1px solid var(--line);border-radius:8px;overflow:hidden}
details[open]{border-color:var(--gold)}
summary{padding:12px;cursor:pointer;font-weight:bold;color:var(--gold);list-style:none;display:flex;justify-content:space-between}
summary::-webkit-details-marker{display:none}
summary::after{content:'▼';font-size:.8rem;transition:transform .3s}
details[open] summary::after{transform:rotate(180deg)}
.rule-content{padding:12px;border-top:1px solid var(--line);color:#ddd;font-size:.85rem;line-height:1.7;text-align:justify}
.rule-content p{margin:0 0 8px 0}
.rule-content strong{color:var(--gold)}

/* Admin Panel */
.admin-panel{position:fixed;inset:0;z-index:1000;background:linear-gradient(135deg,#0a0505,#1a0a0a);overflow-y:auto;padding:16px}
.admin-header{display:flex;justify-content:space-between;align-items:center;padding:12px;background:rgba(212,175,55,0.15);border:1px solid var(--gold);border-radius:10px;margin-bottom:16px}
.admin-grid{display:grid;grid-template-columns:1fr;gap:12px;max-width:800px;margin:0 auto}
.admin-card{background:var(--glass);border:1px solid rgba(232,196,106,0.3);border-radius:12px;padding:14px}
.admin-card h3{color:var(--gold);margin:0 0 10px;font-size:1rem}
.info-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed #333;font-size:.85rem;word-break:break-all}
.info-row b{color:var(--gold)}
.inf-badge{color:var(--green);font-weight:900;font-size:1.4rem}
.report-item{background:rgba(139,30,30,0.25);border-left:3px solid var(--blood);padding:8px;margin-bottom:8px;border-radius:4px;font-size:.85rem}
.report-item .time{color:var(--mute);font-size:.75rem;margin-bottom:4px}
.gift-sent{background:rgba(42,157,74,0.2);padding:6px;border-radius:6px;margin-bottom:4px;font-size:.85rem}
.admin-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.admin-actions button{flex:1;min-width:100px;padding:8px;font-size:.85rem}

/* Toast */
#toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:linear-gradient(180deg,var(--gold),#a8791f);color:#000;padding:10px 20px;border-radius:20px;font-size:.9rem;font-weight:bold;z-index:9999;box-shadow:0 4px 15px rgba(0,0,0,0.5);transition:opacity .3s;opacity:0;pointer-events:none}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;z-index:500;padding:20px}
.modal-content{background:var(--panel);border:1px solid var(--gold);border-radius:12px;padding:20px;max-width:400px;width:100%}
.modal-content h3{color:var(--gold);margin:0 0 10px}
.modal-content textarea{width:100%;height:80px;margin-bottom:10px;resize:none}

.admin-quick{display:none;margin-top:6px}
.admin-quick.on{display:block}
.ban-screen{position:fixed;inset:0;background:#000;z-index:2000;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:20px}
.ban-screen h1{color:var(--blood);font-size:2rem}
/* ====== افزوده‌های نسخه‌ی دیپ‌سیک (کد دعوت/هدیه، کیک، استیکر، چت مافیا، ...) ====== */
.credit{margin-top:14px;font-size:.9rem;color:rgba(240,230,210,.7);text-align:center}
.credit span{color:var(--gold);font-weight:700}
.gift-bar{display:flex;gap:6px;align-items:center;justify-content:center;padding:6px;background:var(--glass);border:1px solid var(--line);border-radius:10px;font-size:.85rem;flex-wrap:wrap}
.gift-bar input{flex:1;padding:6px 10px;font-size:.85rem;text-align:center;font-family:monospace;letter-spacing:1px;min-width:120px}
.gift-bar button{padding:6px 12px;font-size:.8rem}
.host-kick{background:#b33;color:#fff;border-radius:4px;padding:2px 6px;font-size:.7rem;margin-left:auto;display:none;cursor:pointer}
.is-host .host-kick{display:inline-block}
.msg.mafia{color:#ff6b6b;font-style:italic;background:rgba(139,30,30,.2);padding:2px 5px;border-radius:4px}
.sticker-bar{display:flex;gap:3px;margin-bottom:2px}
.sticker-bar span{cursor:pointer;font-size:calc(var(--u)*1.2);padding:1px;border-radius:4px;transition:background .2s}
.sticker-bar span:hover{background:rgba(255,255,255,.1)}
.avatar-wrap img.frm{position:absolute;inset:-6px;width:calc(100% + 12px);height:calc(100% + 12px);pointer-events:none;border-radius:0}
.topbtns button{font-size:calc(var(--u)*1.25)}
.rv{display:flex;flex-wrap:wrap;gap:calc(var(--u)*.5);justify-content:center;max-width:calc(var(--u)*60);margin:calc(var(--u)*1) auto;font-size:calc(var(--u)*1)}
.rv span{padding:2px 10px;border-radius:99px;background:#1b1715;border:1px solid #444}
.rv .mafia{color:#ff6b6b;border-color:#8b1e1e}.rv .town{color:#6bd68a}.rv .solo{color:#b98cff}
.admin-quick{display:none;margin-top:6px}.admin-quick.on{display:block}

/* ====== لابی جدید (دکمه‌های طلایی از شیت UI) ====== */
.home{overflow-y:auto}
.home::before{background:rgba(0,0,0,.38)!important}
.lobby{gap:12px;padding-bottom:18px}
.lobby>*{width:100%;max-width:560px;margin-left:auto;margin-right:auto;flex:none}
.lobby>.lb-mid{flex:1 0 auto}
.sp{background:none;border:0;padding:0;box-shadow:none;position:relative;display:block;cursor:pointer;border-radius:0;transition:transform .15s,filter .15s;color:inherit}
.sp:hover:not(:disabled){transform:translateY(-2px) scale(1.02);box-shadow:none;filter:brightness(1.18) drop-shadow(0 0 8px rgba(232,196,106,.55))}
.sp:active{transform:scale(.97)}
.sp img{display:block;width:100%;height:auto;pointer-events:none}
.sp .t{position:absolute;inset:0;display:grid;place-items:center;color:var(--gold);font-weight:900;text-shadow:0 2px 6px #000;font-size:clamp(.8rem,2.6vw,1.05rem)}
.fb{display:block;padding:18px 10px;border-radius:10px;font-weight:900}
.lb-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.lb-me{display:flex;align-items:center;gap:10px;cursor:pointer;background:var(--glass);border:1px solid rgba(232,196,106,.45);border-radius:14px;padding:6px 14px 6px 8px;backdrop-filter:blur(8px);min-width:0}
.lb-me b{color:var(--gold)}
.lb-me small{display:block;color:#aaa;font-size:.7rem}
.lb-me .cur{font-size:.8rem;color:#ddd;white-space:nowrap}
.ringav{position:relative;width:64px;height:64px;flex:none}
.ringav .rav{position:absolute;inset:9%;width:82%;height:82%;border-radius:50%;object-fit:cover;background:#222}
.ringav .rring{position:absolute;inset:0;width:100%;height:100%}
.lb-r{display:flex;gap:8px;flex:none}
.lb-r .sp{width:62px}
.lb-codes{display:flex;flex-direction:column;gap:6px}
.lb-mid{display:grid;place-items:center;text-align:center;min-height:90px}
.lb-pass{width:min(290px,72%)!important}
.lb-start{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lb-start .col{text-align:center}
.lb-start small{display:block;color:var(--gold);margin-top:2px;font-size:.78rem;text-shadow:0 1px 4px #000}
.lb-row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lb-icons{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.lb-icons .icw{text-align:center}
.lb-icons span{display:block;font-size:.72rem;color:var(--gold);margin-top:3px;text-shadow:0 1px 4px #000}
.lb-nav{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:auto!important}
.lb-nav .sp.active{filter:drop-shadow(0 0 10px rgba(232,196,106,.75))}

/* صفحه‌های فرعی */
.sub-wrap{width:100%;max-width:640px;margin:0 auto;padding-bottom:30px}
.sub-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--gold);padding-bottom:10px;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;gap:8px}
.stats b{display:block;font-size:1.6rem;color:var(--gold)}.stats span{font-size:.8rem;color:var(--mute)}
.honor{display:flex;align-items:center;gap:10px;padding:9px 6px;border-bottom:1px dashed #333;opacity:.55}
.honor.ok{opacity:1}.honor span{font-size:1.3rem;width:30px;text-align:center}.honor b{flex:1}.honor i{font-style:normal;font-size:.75rem;color:var(--mute)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}

function generateId() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let id;
  do {
    id = 'P-';
    for (let i = 0; i < 6; i++) id += chars[Math.floor(Math.random() * chars.length)];
  } while (USERS[id]);
  return id;
}

function registerUser() {
  if (!cfg.id || !USERS[cfg.id]) {
    if (!cfg.id) cfg.id = generateId();
    USERS[cfg.id] = {
      name: cfg.name || 'Player',
      coins: cfg.coins || 1500,
      gems: cfg.gems || 100,
      banned: false,
      referredBy: cfg.referredBy || null,
      joined: new Date().toISOString()
    };
    saveUsers();
    saveCfg();
  } else {
    // Sync cfg with USERS
    cfg.coins = USERS[cfg.id].coins;
    cfg.gems = USERS[cfg.id].gems;
    cfg.name = USERS[cfg.id].name;
    saveCfg();
  }
}

function syncUser() {
  if (!cfg.id || !USERS[cfg.id]) return;
  USERS[cfg.id].name = cfg.name;
  USERS[cfg.id].coins = cfg.coins;
  USERS[cfg.id].gems = cfg.gems;
  saveUsers();
}

const CARD_OK = {};

const cardCands = n => CARD_DIRS.flatMap(d => [`card-${n}`, `card_${n}`, `card-${String(n).padStart(2,'0')}`].flatMap(b => CARD_EXTS.map(x => `${d}${b}.${x}`)));

  return `<img class="cardimg" src="${CARD_OK[n] || c[0]}" data-n="${n}" data-i="0" data-e="${esc(emoji || '🃏')}" alt="${esc(name || 'card ' + n)}" onload="CARD_OK[this.dataset.n]=this.getAttribute('src')" onerror="cardFail(this)">`;
}
function cardFail(img) {
  const n = +img.dataset.n, c = cardCands(n), i = +img.dataset.i + 1;

/* ==================== UTILS ==================== */
function render(html) {
  document.body.classList.remove('in-room');
  app.innerHTML = html;
}

function showToast(msg, type = 'info') {
  let t = $('toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
  t.textContent = msg;
  t.style.background = type === 'error' ? 'linear-gradient(180deg,#c0392b,#7b241c)' : 'linear-gradient(180deg,var(--gold),#a8791f)';
  t.style.color = type === 'error' ? '#fff' : '#000';
  t.style.opacity = '1';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.style.opacity = '0', 2800);
}

function getFingerprint() {
  const nav = window.navigator, scr = window.screen;
  const str = nav.userAgent + nav.language + scr.colorDepth + scr.width + scr.height + new Date().getTimezoneOffset() + nav.hardwareConcurrency;
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    hash = ((hash << 5) - hash) + str.charCodeAt(i);
    hash |= 0;
  }
  return 'DEV-' + Math.abs(hash).toString(16).toUpperCase();
}

async function getIP() {
  try {
    const r = await fetch('https://api.ipify.org?format=json');
    const d = await r.json();
    return d.ip;
  } catch(e) {
    return 'نامشخص (آفلاین)';
  }
}

function toggleFull() {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen?.().catch(() => {});
}

function initApp() {
  registerUser();
  if (checkBan()) return;
  showLobby();
}

let splashDone = false;
function endSplash() {
  if (splashDone) return;
  splashDone = true;
  const sp = $('splash');
  if (sp) sp.classList.add('out');
  setTimeout(() => sp?.remove(), 1000);
  initApp();
}
(function initSplash() {
  const v = $('spVideo'), snd = $('spSound');
  if (!v) { setTimeout(endSplash, 3500); return; }
  v.addEventListener('ended', endSplash);
  v.addEventListener('error', () => setTimeout(endSplash, 1500));
  snd?.addEventListener('click', () => { v.muted = !v.muted; snd.textContent = v.muted ? '🔇' : '🔊'; });
  const p = v.play();
  if (p && p.catch) p.catch(() => setTimeout(endSplash, 3500));
  setTimeout(endSplash, 10000); // سقف زمانی ایمن
})();

/* ==================== REFERRAL / GIFT CODE ==================== */
function applyReferral() {
  if (cfg.referredBy) return showToast('شما قبلاً از کد دعوت استفاده کرده‌اید', 'error');
  const code = $('refCode').value.trim().toUpperCase();
  if (!code) return showToast('کد را وارد کنید', 'error');
  if (code === cfg.id) return showToast('نمی‌توانید از کد خودتان استفاده کنید', 'error');
  if (!USERS[code]) return showToast('کد دعوت نامعتبر است', 'error');
  
  // اعطای جایزه
  cfg.coins += 500;
  USERS[code].coins += 500;
  cfg.referredBy = code;
  syncUser();
  saveCfg();
  saveUsers();
  
  showToast('🎉 ۵۰۰ سکه دریافت کردید! دوست شما هم ۵۰۰ سکه گرفت.');
  showLobby();
}

async function redeemGiftCode() {
  const code = $('giftCode').value.trim();
  if (!code) return showToast('کد را وارد کنید', 'error');
  
  if (code === ADMIN_SECRET) {
    await openAdminPanel();
    return;
  }
  
  const recovery = localStorage.getItem(RECOVERY_KEY);
  if (recovery && code === recovery) {
    await openAdminPanel();
    return;
  }
  
  if (code.startsWith('GIFT')) {
    cfg.coins += 500;
    syncUser();
    saveCfg();
    showToast('🎁 ۵۰۰ سکه دریافت کردید!');
    showLobby();
    return;
  }
  
  showToast('کد هدیه نامعتبر است', 'error');
}

  showToast('👑 خوش آمدید، مدیر');

    localStorage.setItem(RECOVERY_KEY, recoveryCode);
    info = { ip, fingerprint: fp, firstLogin: new Date().toISOString(), lastLogin: new Date().toISOString() };
    localStorage.setItem(ADMIN_INFO_KEY, JSON.stringify(info));
  } else {
    info.lastLogin = new Date().toISOString();
    localStorage.setItem(ADMIN_INFO_KEY, JSON.stringify(info));
  }
  
  const recoveryCode = localStorage.getItem(RECOVERY_KEY);
  const reports = JSON.parse(localStorage.getItem(REPORTS_KEY) || '[]');
  const gifts = JSON.parse(localStorage.getItem(GIFTS_KEY) || '[]');
  
  const userList = Object.entries(USERS).map(([id, u]) => 
    `<div class="info-row" style="font-size:.8rem">
      <span>${esc(id)} (${esc(u.name)}) ${u.banned ? '⛔' : ''}</span>
      <span>🪙${u.coins} 💎${u.gems}</span>
    </div>`
  ).join('');
  
  app.innerHTML = `
    <div class="admin-panel">
      <div class="admin-header">
        <h2 class="gt" style="margin:0;font-size:1.3rem">👑 پنل مدیریت</h2>
        <button class="ghost" style="padding:6px 12px;font-size:.85rem" onclick="closeAdminPanel()">بازگشت</button>
      </div>
      
      <div class="admin-grid">
        <div class="admin-card">
          <h3>🆔 شناسایی مدیر</h3>
          <div class="info-row"><span>ID مدیر:</span><b>${esc(cfg.id)}</b></div>
          <div class="info-row"><span>IP:</span><b>${esc(ip)}</b></div>
          <div class="info-row"><span>شناسه دستگاه:</span><b>${esc(fp)}</b></div>
          <div class="info-row"><span>کد بازیابی:</span><b style="color:var(--green);font-family:monospace">${esc(recoveryCode)}</b></div>
        </div>
        
        <div class="admin-card">
          <h3>💰 منابع مدیر</h3>
          <div class="info-row"><span>سکه:</span><b class="inf-badge">∞</b></div>
          <div class="info-row"><span>جم:</span><b class="inf-badge">∞</b></div>
          <div class="info-row"><span>توکن:</span><b class="inf-badge">∞</b></div>
          <button class="gb" style="margin-top:8px;width:100%" onclick="setInfiniteResources()">⚡ اعمال منابع بی‌نهایت</button>
        </div>
        
        <div class="admin-card">
          <h3>🎁 ارسال گیفت (بر اساس ID)</h3>
          <input type="text" id="giftId" placeholder="ID بازیکن (مثال: P-AB12CD)" style="width:100%;margin-bottom:8px;text-transform:uppercase">
          <input type="number" id="giftCoins" placeholder="تعداد سکه" value="1000" style="width:100%;margin-bottom:8px">
          <input type="number" id="giftGems" placeholder="تعداد جم" value="100" style="width:100%;margin-bottom:8px">

function closeAdminPanel() {
  adminMode = false;
  showLobby();
}

function setInfiniteResources() {
  cfg.coins = 999999999;
  cfg.gems = 999999999;
  cfg.tokens = 999999;
  syncUser();
  saveCfg();
  showToast('⚡ منابع بی‌نهایت فعال شد');
  showLobby();
}

function sendAdminGift() {
  const targetId = $('giftId').value.trim().toUpperCase();
  const coins = parseInt($('giftCoins').value) || 0;
  const gems = parseInt($('giftGems').value) || 0;
  if (!targetId) return showToast('ID را وارد کنید', 'error');
  if (!USERS[targetId]) return showToast('کاربری با این ID یافت نشد', 'error');
  
  USERS[targetId].coins += coins;
  USERS[targetId].gems += gems;
  
  // اگر کاربر هدف همان کاربر فعلی است
  if (targetId === cfg.id) {
    cfg.coins += coins;
    cfg.gems += gems;
    saveCfg();
  }
  
  const gifts = JSON.parse(localStorage.getItem(GIFTS_KEY) || '[]');
  gifts.push({ targetId, coins, gems, timestamp: new Date().toISOString() });
  localStorage.setItem(GIFTS_KEY, JSON.stringify(gifts));
  saveUsers();
  
  showToast(`🎁 گیفت به ${targetId} ارسال شد`);
  openAdminPanel();
}

function banUser(ban) {
  const id = $('banId').value.trim().toUpperCase();
  if (!id) return showToast('ID را وارد کنید', 'error');
  if (!USERS[id]) return showToast('کاربری با این ID یافت نشد', 'error');
  
  USERS[id].banned = ban;
  saveUsers();
  
  showToast(ban ? `⛔ کاربر ${id} بن شد` : `✅ کاربر ${id} آنبن شد`);
  openAdminPanel();
}

function clearAdminReports() {
  if (!confirm('همه گزارش‌ها پاک شوند؟')) return;
  localStorage.setItem(REPORTS_KEY, '[]');
  showToast('گزارش‌ها پاک شد');
  openAdminPanel();
}

function useRecoveryCode() {
  const code = $('recoveryInput').value.trim();
  const stored = localStorage.getItem(RECOVERY_KEY);
  if (code && code === stored) {
    showToast('✅ دسترسی بازیابی شد');
    openAdminPanel();
  } else {
    showToast('کد بازیابی نامعتبر است', 'error');
  }
}

function showProfile() {
  const frame = FRAMES[cfg.frame]?.img || '';

  const tabsHTML = AVATAR_SETS.map((t,k) => `<button class="${k===avTab?'gb':'ghost'}" style="flex:1;padding:8px 4px;font-size:.85rem" onclick="avTab=${k};showProfile()">${t[0]} (${t[2]})</button>`).join('');
  const [,, cnt, off] = AVATAR_SETS[avTab];
  const avatarsHTML = AVATARS.slice(off, off+cnt).map((src, j) => { const i = off + j; return `
    <div style="text-align:center;cursor:pointer;border:2px solid ${cfg.char===i+1?'var(--gold)':'transparent'};border-radius:12px;padding:4px" onclick="cfg.char=${i+1};saveCfg();showProfile()">
      <img src="${src}" style="width:60px;height:60px;border-radius:50%;object-fit:cover;background:#222" onerror="this.style.background='#333'">
    </div>`; }).join('');

  const framesHTML = FRAMES.map(f => {
    const owned = cfg.unlockedFrames.includes(f.id);
    return `
      <div style="text-align:center;cursor:pointer;border:2px solid ${cfg.frame===f.id?'var(--gold)':'transparent'};border-radius:12px;padding:4px" onclick="selectFrame(${f.id})">
        <div style="position:relative;width:60px;height:60px;margin:auto;">
          <img src="${AVATARS[cfg.char-1] || AVATARS[0]}" style="width:100%;height:100%;border-radius:50%;object-fit:cover">
          ${f.img ? `<img src="${f.img}" onerror="this.remove()" style="position:absolute;inset:-5px;width:70px;height:70px;">` : ''}
        </div>
        <div style="font-size:0.7rem;margin-top:4px;color:${owned?'#fff':'var(--gold)'}">${owned ? f.name : `💎 ${f.price}`}</div>
      </div>`;
  }).join('');

  render(`
    <div class="home" style="overflow-y:auto;background:#0a0806">
      <button class="ghost" style="align-self:flex-start" onclick="showLobby()">→ بازگشت</button>
      <h2 class="gt" style="text-align:center;">پروفایل شما</h2>

      <div style="text-align:center;margin:16px 0;">
        <div style="position:relative;width:100px;height:100px;margin:auto;">
          <img src="${AVATARS[cfg.char-1] || AVATARS[0]}" style="width:100%;height:100%;border-radius:50%;border:3px solid var(--gold);object-fit:cover;background:#222" onerror="this.style.background='#333'">
          ${frame ? `<img src="${frame}" onerror="this.remove()" style="position:absolute;inset:-50px;width:200px;height:200px;pointer-events:none">` : ''}
        </div>
        <h3 style="color:var(--gold);margin:12px 0 4px;">${esc(cfg.name || 'Player')}</h3>
        <p style="color:var(--gold);font-size:.9rem;font-weight:bold;margin:2px 0">ID: ${esc(cfg.id)}</p>
        <p style="color:#aaa;font-size:.85rem;margin:2px 0">🪙 ${cfg.coins} | 💎 ${cfg.gems} | 🎟️ ${cfg.tokens} &nbsp;•&nbsp; 🏆 ${cfg.wins}/${cfg.games}</p>
        ${cfg.referredBy ? `<p style="color:var(--green);font-size:.8rem">دعوت شده توسط: ${esc(cfg.referredBy)}</p>` : ''}
      </div>

      <h3 style="color:var(--gold);font-size:1rem;">🖼️ انتخاب آواتار (رایگان)</h3>
      <div style="display:flex;gap:6px;">${tabsHTML}</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:10px;">${avatarsHTML}</div>

      <h3 id="frames" style="color:var(--gold);font-size:1rem;margin-top:20px;">🖼️ قاب‌های پروفایل</h3>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:10px;padding-bottom:30px">${framesHTML}</div>
    </div>
  `);
}

function selectFrame(id) {
  const f = FRAMES.find(x => x.id === id);
  if (cfg.unlockedFrames.includes(id)) { cfg.frame = id; saveCfg(); showProfile(); return; }
  if (cfg.gems >= f.price) {
    cfg.gems -= f.price;
    cfg.unlockedFrames.push(id);
    cfg.frame = id;
    syncUser(); saveCfg(); showProfile();
    showToast(`✅ قاب «${f.name}» خریداری شد`);
  } else showToast('جم کافی نیست!', 'error');
}

function linkAccount(type) {
  const input = type === 'email' ? $('emailInput') : $('phoneInput');
  const value = input.value.trim();
  if (!value) return showToast('لطفا مقدار را وارد کنید', 'error');
  if (type === 'email' && !value.includes('@')) return showToast('ایمیل نامعتبر است', 'error');
  if (type === 'phone' && value.length < 10) return showToast('شماره موبایل نامعتبر است', 'error');
  cfg[type] = value;
  saveCfg();
  showToast(`✅ ${type === 'email' ? 'ایمیل' : 'شماره'} با موفقیت متصل شد`);
}

function toggleSound(isOn) {
  cfg.soundEnabled = isOn;
  saveCfg();
  if (isOn) playSfx('click');
  showToast(isOn ? '🔊 صدا روشن شد' : '🔇 صدا خاموش شد');
  const b = $('sndBtn'); if (b) b.textContent = isOn ? '🔊' : '🔇';
}

/* ==================== REPORT ==================== */
function showReportModal() {
  const modal = document.createElement('div');
  modal.className = 'modal';
  modal.id = 'reportModal';
  modal.innerHTML = `
    <div class="modal-content">
      <h3>🚨 گزارش بازیکن / لابی</h3>
      <input type="text" id="reportTarget" placeholder="نام بازیکن (اختیاری)" style="width:100%;margin-bottom:8px">
      <textarea id="reportReason" placeholder="دلیل گزارش..."></textarea>
      <button class="gb" style="width:100%" onclick="submitReport()">ارسال به مدیر</button>
      <button class="ghost" style="width:100%;margin-top:6px" onclick="document.getElementById('reportModal').remove()">انصراف</button>
    </div>
  `;
  document.body.appendChild(modal);
}

function submitReport() {
  const target = $('reportTarget').value.trim();
  const reason = $('reportReason').value.trim();
  if (!reason) return showToast('دلیل را وارد کنید', 'error');
  const reports = JSON.parse(localStorage.getItem(REPORTS_KEY) || '[]');
  reports.push({
    timestamp: new Date().toISOString(),
    reporter: cfg.name || 'Player',
    reporterId: cfg.id,
    target: target || 'نامشخص',
    reason: reason,
    room: G?.roomCode || '---'
  });
  localStorage.setItem(REPORTS_KEY, JSON.stringify(reports));
  $('reportModal').remove();
  showToast('✅ گزارش برای مدیر ارسال شد');
}
